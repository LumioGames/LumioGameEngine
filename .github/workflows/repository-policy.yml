name: LumioGameEngine Development

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  development:
    name: Build SDK and prove Host loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: LumioGameEngineArchitecture
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioNativeCore
          path: LumioNativeCore
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioVoxelEngine
          path: LumioVoxelEngine
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioServer
          path: LumioServer
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioClient
          path: LumioClient
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate ABI bindings
        working-directory: LumioGameEngineArchitecture
        run: node eng/generate-abi.mjs
      - name: Build SDK Native library
        working-directory: LumioGameEngineArchitecture
        run: chmod +x eng/dev-build.sh && ./eng/dev-build.sh
      - name: Run SDK Rust tests
        working-directory: LumioGameEngineArchitecture/engine/native
        run: cargo test -p lumio-engine-native
      - name: Run Loader tests
        working-directory: LumioGameEngineArchitecture
        run: dotnet test engine/managed/Lumio.Engine.NativeLoader.Tests/Lumio.Engine.NativeLoader.Tests.csproj
      - name: Build Server and Client hosts
        run: |
          dotnet build LumioServer/mvp-host/src/Lumio.Server.MvpHost.App/Lumio.Server.MvpHost.App.csproj
          dotnet build LumioClient/modules/bot/host/Lumio.Client.Bot.Host.csproj
