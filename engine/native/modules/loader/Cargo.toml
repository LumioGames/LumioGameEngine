[package]
name = "lumio-core-loader"
description = "Loader 状态机与 LoaderLease：单飞 Acquire、PackageIdentity 锁定、同对象验证/映射、逻辑回滚与 No-Physical-Unload（规格 §12）。"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# 运行时 crate：运行时发布闭包的根（规格 §3.7），默认 feature 必须最小；
# 禁止编译依赖 manifest 生成器、signer-tool、evidence-generator 与 diagnostics 实现。
[features]
default = []
