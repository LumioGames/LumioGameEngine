[package]
name = "lumio-engine-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lumio-kernel = { path = "../../../../../LumioNativeCore/crates/lumio-kernel" }
lumio-voxel-world = { path = "../../../../../LumioVoxelEngine/crates/lumio-voxel-world" }
# CoreCLR 装载链（MS-00002 Wave 2）：根表三槽直接转发到该 crate 的 ABI 实现，
# 全链只有这一套 CLR Loader/ABI。
lumio-clr-host = { path = "../clr-host" }

[dev-dependencies]
