# LumioCoreEngine 根 workspace（LCE-P0-001）。
# 15 个 member 显式列出，禁止 glob / exclude 兜底（规格 §3.2）。
# crate 名与规格 §3.1 一一对应，不得增删改名。

[workspace]
resolver = "2"
members = [
    "modules/composition",
    "modules/root-abi/contracts",
    "modules/root-abi/runtime",
    "modules/root-abi/generator",
    "modules/platform/contracts",
    "modules/platform/runtime",
    "modules/platform/build",
    "modules/manifest",
    "modules/signing/evidence-generator",
    "modules/signing/signer-tool",
    "modules/signing/runtime-verifier",
    "modules/signing/trust-policy",
    "modules/loader",
    "modules/diagnostics",
    "modules/smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89.0"
repository = "https://github.com/LumioGames/LumioCoreEngine"
publish = false

# 直接依赖统一在此固定精确版本；crate 只能经 `<dep>.workspace = true` 消费，
# 不得自行漂移版本（规格 §3.2）。逐项选型记录见规格 §4 与 `.spec/decisions/`。
[workspace.dependencies]
# BuildPlan 的 typed 结构与确定性紧凑 JSON 编码（ADR 0006 第 2 条指定实现载体）。
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Digest：规格 §4「Digest」行选定 sha2 0.11.0。
sha2 = "=0.11.0"
# compose 配置（`*.compose.toml`）与 tools.lock.toml 的解析（ADR 0007）。
toml = "=1.1.4"
# 属性测试：规格 §4「测试/Fixture/Golden/属性测试」行已选定 proptest 1.11.0。
# 只作 dev-dependency 使用，不进入任何运行时闭包。
proptest = "=1.11.0"
