[package]
name = "lumio-core-contracts"
description = "架构源生成 ContractTypes/ErrorCode/Capability/Schema registry 的唯一 re-export 面；本仓不得手写第二套公共类型（规格 §6.1、§8.2）。"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# 运行时 crate：进入运行时发布闭包（规格 §3.7），默认 feature 必须最小。
# 禁止动态生成的 build.rs；生成文件只能来自架构源制品（LCE-P0-003）。
[features]
default = []
