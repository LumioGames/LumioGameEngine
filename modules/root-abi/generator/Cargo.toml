[package]
name = "lumio-core-root-abi-generator"
description = "ABI 生成 Adapter：只调用锁定的架构源 compiler 并校验 hash，不含模板/slot/type map（AG-001、规格 §8.2）。"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# 构建期 crate：不进入运行时发布闭包（规格 §3.7），运行时 crate 禁止引用。
[features]
default = []

[dependencies]
# ADR 0004 第 3 条冻结的允许边：root-abi-generator -> contracts, composition。
# 本卡只用到 serde 系与 sha2；composition 边由 LCE-P0-008 消费计划时接入。
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# 已冻结计划的唯一合法读法（ADR 0006 第 8 条：消费者不得自建第二套解析器）。
lumio-core-composition = { path = "../../composition", version = "0.1.0" }

[dev-dependencies]
# 测试要按字段改写 descriptor 来构造反例。
serde_json = { workspace = true }

[[bin]]
name = "lumio-core-root-abi-generator"
path = "src/bin/lumio-core-root-abi-generator.rs"
