# 外部工具锁（LCE-P0-001，规格 §3.5）。
# 每项固定：name, version, source_url, source_commit, license_spdx, artifact_sha256,
# supported_hosts, invocation, owner, exit_tool。
#   artifact_sha256 = source_url 指向的分发制品（release archive）的 SHA-256；
#   本机实际安装的二进制 SHA-256 登记在 tools/checksums.sha256（key = name@host），
#   由 tools/verify-tool-lock.sh 双向校验。
#   source_commit 为 `git ls-remote` 对 release tag ref 的解析值：轻量 tag 与直接引用
#   分支时是 commit，标注 tag 时是 tag 对象 SHA。以 artifact_sha256 为准，commit 只用于
#   定位上游源码。
# 新增/升级工具必须走规格 §4 选型记录（候选、许可证、退出路径）并同步本文件与 checksums。
#
# 一个工具在多个 host 上是多条 [[tools]] 条目（R-00265）：十字段里 source_url 与
# artifact_sha256 各只有一份，而不同 host 的分发制品是不同文件，合并登记必然要伪造
# 其中一个。verify-tool-lock.sh 按 name@host 建立期望键，同名多条目天然并存。

