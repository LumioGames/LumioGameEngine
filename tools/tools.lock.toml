# ── linux-x86_64 制品（R-00265）────────────────────────────────────────────
#
# 取值环境（executable SHA-256 的唯一出处，取自 tool-lock.yml 的 measure 步骤日志）：
#   runner       ImageOS=ubuntu22 ImageVersion=20260824.273.3
#   kernel       Linux 6.8.0-1064-azure x86_64
#   libc         Ubuntu GLIBC 2.35-0ubuntu3.14（对齐 TargetProfile sdk=glibc-2.35）
#   gcc-11 apt   11.4.0-1ubuntu1~22.04.3
#   rustc        1.89.0 (29483883e 2025-08-04) host x86_64-unknown-linux-gnu
#   cargo        1.89.0 (c24e10642 2025-06-23)
#   取值命令     sha256sum $(command -v <name>)
# 换 runner 镜像或包版本后摘要会漂移：门禁会显式失败并打印候选版本，按同一流程重测重登，
# 不得就地改数。
#
# artifact_sha256 取自各分发制品的官方摘要；四项校验器由 CI 在解压前逐个对账，不一致
# 即 exit 1（日志中的 `archive <name>: locked=… actual=…` 行即对账证据）。
#
# 两个 host key 的分工：
#   linux-x86_64          校验器四项。摘要由 source_url 指向的 release 归档唯一决定，
#                         任何 Linux 机器按 source_url 装都能得到同一份，故对所有
#                         linux 宿主生效（含开发机）。
#   linux-x86_64-p0-build 工具链三项。摘要只在**钉定的 P0 构建环境**内成立，默认不参与
#                         判定，须显式 LCE_BUILD_ENVIRONMENT=p0-build（CI 已设）。
#                         开发机上 `command -v rustc` 命中 ~/.cargo/bin 的 rustup shim，
#                         而这里登记的是工具链真身（~/.rustup/toolchains/<ver>-<target>/bin/）
#                         ——shim 的摘要是 rustup 版本的函数，锁它等于锁错对象；若让开发机
#                         也判定这三条，`just check` 会永远红在一条与其无关的漂移上。

